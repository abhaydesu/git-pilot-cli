name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: catches newly published advisories

permissions:
  contents: read

jobs:
  test-linux-secret-service:
    name: Linux (Secret Service + PTY E2E)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y expect libsecret-tools gnome-keyring dbus-x11
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check src bin test
      - name: Run unit tests + Secret Service smoke test
        env:
          GIT_PILOT_REQUIRE_NATIVE_STORE_TEST: "1"
        run: |
          dbus-run-session -- sh -c '
            set -e
            eval $(echo "" | gnome-keyring-daemon --unlock --components=secrets 2>/dev/null) || true
            export GNOME_KEYRING_CONTROL
            npm test
            npm run test:e2e
          '
      - run: npm audit --omit=dev --audit-level=high

  test-linux-headless:
    name: Linux (Headless / No Secret Service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y expect
      - run: npm ci
      - name: Run unit & E2E suites without DBUS_SESSION_BUS_ADDRESS
        run: |
          unset DBUS_SESSION_BUS_ADDRESS
          npm test
          npm run test:e2e

  test-macos:
    name: macOS (Keychain + PTY E2E)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run unit tests + real macOS Keychain smoke test
        env:
          GIT_PILOT_REQUIRE_NATIVE_STORE_TEST: "1"
        run: npm test
      - run: npm run test:e2e

  test-windows:
    name: Windows (Credential Manager)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run unit tests + real Windows Credential Manager smoke test
        env:
          GIT_PILOT_REQUIRE_NATIVE_STORE_TEST: "1"
        run: npm test
