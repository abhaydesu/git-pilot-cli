name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: catches newly published advisories

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y expect
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check src bin test
      - run: npm test
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
